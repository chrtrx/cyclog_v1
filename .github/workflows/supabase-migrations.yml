name: Supabase Migrations

# Wendet alle SQL-Migrationen auf das Supabase-Projekt an, sobald sie nach
# main gemerged werden. Kann zusätzlich manuell über "Run workflow" im
# Actions-Tab gestartet werden.
#
# Verbindet sich direkt per psql mit der Datenbank. Die Vorgängerfassung
# nutzte die Management-API mit einem persönlichen Access-Token – das kam
# ohne Datenbank-Passwort aus, lief dafür aber alle paar Wochen ab und hat
# den Workflow zweimal ohne Vorwarnung lahmgelegt. Ein Datenbank-Passwort
# läuft nicht ab.
#
# Alle Migrationen sind idempotent (IF NOT EXISTS), daher ist es
# unbedenklich, dass bei jedem Lauf sämtliche Dateien (001..) erneut
# ausgeführt werden. Jede Datei läuft in EINER Transaktion: Scheitert eine
# Anweisung, wird die ganze Datei zurückgerollt statt halb angewendet.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: psql bereitstellen
        run: |
          psql --version >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          }
          psql --version

      - name: Verbindung prüfen
        run: |
          set -uo pipefail
          url="$(printf '%s' "${DB_URL:-}" | tr -d '[:space:]')"

          if [ -z "$url" ]; then
            echo "::error::Secret SUPABASE_DB_URL fehlt."
            echo "::error::So anlegen: Supabase-Dashboard → Project Settings → Database → Connection string → Session pooler. Zeichenfolge kopieren, [YOUR-PASSWORD] durch das Datenbank-Passwort ersetzen, dann in GitHub unter Settings → Secrets and variables → Actions als SUPABASE_DB_URL speichern."
            exit 1
          fi

          case "$url" in
            postgresql://*|postgres://*) : ;;
            *) echo "::error::SUPABASE_DB_URL sieht nicht wie eine Verbindungszeichenfolge aus (erwartet wird etwas, das mit postgresql:// beginnt)."
               exit 1 ;;
          esac

          if printf '%s' "$url" | grep -q 'YOUR-PASSWORD\|\[YOUR'; then
            echo "::error::In SUPABASE_DB_URL steht noch der Platzhalter [YOUR-PASSWORD]. Bitte durch das echte Datenbank-Passwort ersetzen (Dashboard → Project Settings → Database → Reset database password, falls unbekannt)."
            exit 1
          fi

          # GitHub-Runner sprechen nur IPv4. Die direkte Verbindung
          # (db.<ref>.supabase.co) ist aber nur über IPv6 erreichbar, solange
          # kein IPv4-Add-on gebucht ist. Ohne diesen Hinweis endet das in
          # einem nichtssagenden "Network is unreachable".
          if printf '%s' "$url" | grep -q '@db\.[a-z]*\.supabase\.co'; then
            echo "::error::Das ist die DIREKTE Verbindung – die ist nur über IPv6 erreichbar, GitHub-Runner haben aber nur IPv4."
            echo "::error::Bitte stattdessen die Zeichenfolge unter 'Session pooler' verwenden (Host endet auf .pooler.supabase.com, Benutzer lautet postgres.<project-ref>)."
            exit 1
          fi

          # Zugang EINMAL vorab prüfen. Sonst scheitert jede einzelne
          # Migration an derselben Ursache und die geht in Folgefehlern unter.
          if psql "$url" -At -c 'select 1' >/dev/null 2>probe.err; then
            echo "✓ Verbindung steht."
          else
            msg="$(cat probe.err)"
            echo "$msg"
            case "$msg" in
              *"password authentication failed"*)
                echo "::error::Passwort abgelehnt. Datenbank-Passwort im Dashboard unter Project Settings → Database zurücksetzen und SUPABASE_DB_URL neu setzen." ;;
              *"Network is unreachable"*|*"could not translate host name"*)
                echo "::error::Host nicht erreichbar. Fast immer die falsche Zeichenfolge – es muss die unter 'Session pooler' sein." ;;
              *"Tenant or user not found"*)
                echo "::error::Benutzer passt nicht zum Pooler. Beim Session pooler lautet er postgres.<project-ref>, nicht bloß postgres." ;;
              *)
                echo "::error::Verbindung fehlgeschlagen (siehe Meldung oben). Pausierte Projekte im Free-Tier müssen im Dashboard zuerst reaktiviert werden." ;;
            esac
            exit 1
          fi

      - name: Migrationen anwenden
        run: |
          set -uo pipefail
          url="$(printf '%s' "${DB_URL}" | tr -d '[:space:]')"
          fail=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "── Wende an: $f"
            # --single-transaction: ganze Datei oder gar nichts.
            # ON_ERROR_STOP: psql bricht bei der ersten Fehlermeldung ab,
            # statt weiterzulaufen und am Ende trotzdem 0 zurückzugeben.
            if psql "$url" --single-transaction -v ON_ERROR_STOP=1 -q -f "$f"; then
              echo "   ✓ ok"
            else
              echo "::error::$f fehlgeschlagen – die Datei wurde komplett zurückgerollt."
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::Mindestens eine Migration ist fehlgeschlagen."
            exit 1
          fi
          echo "✓ Alle Migrationen erfolgreich angewendet."
