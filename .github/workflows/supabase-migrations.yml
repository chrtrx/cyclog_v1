name: Supabase Migrations

# Wendet alle SQL-Migrationen automatisch auf das Supabase-Projekt an,
# sobald sie nach main gemerged werden. Nutzt die Supabase Management API
# (POST .../database/query) — dadurch wird KEIN Datenbank-Passwort benötigt,
# nur ein Access-Token. Läuft nur, wenn sich Migrationen geändert haben,
# und kann zusätzlich manuell über "Run workflow" im Actions-Tab gestartet
# werden.
#
# Alle Migrationen sind idempotent (IF NOT EXISTS), daher ist es unbedenklich,
# dass bei jedem Lauf sämtliche Dateien (001..) erneut ausgeführt werden.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Migrationen anwenden (Management API)
        run: |
          set -uo pipefail

          # Secrets von versehentlichen Leerzeichen/Zeilenumbrüchen befreien
          # (häufig beim Kopieren auf dem Handy).
          ref="$(printf '%s' "${SUPABASE_PROJECT_REF:-}" | tr -d '[:space:]')"
          token="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"

          if [ -z "$ref" ] || [ -z "$token" ]; then
            echo "::error::Fehlende Secrets. Bitte SUPABASE_ACCESS_TOKEN und SUPABASE_PROJECT_REF anlegen."
            exit 1
          fi

          # Diagnose: Der Projekt-Ref muss exakt 20 Kleinbuchstaben (a-z) sein.
          echo "PROJECT_REF Länge: ${#ref} (erwartet: 20)"
          if printf '%s' "$ref" | grep -qE '^[a-z]{20}$'; then
            echo "PROJECT_REF Format: OK"
          else
            echo "::error::SUPABASE_PROJECT_REF passt nicht zum erwarteten Format (genau 20 Kleinbuchstaben a-z). Bitte im Dashboard unter Settings → General die 'Reference ID' prüfen und das Secret korrigieren."
            exit 1
          fi

          # Zugang EINMAL vorab prüfen. Ohne diesen Schritt scheitert jede
          # einzelne Migration mit demselben 401 und die eigentliche Ursache
          # geht in einer Wand aus Folgefehlern unter.
          probe=$(curl -sS -o probe.json -w "%{http_code}" \
            -H "Authorization: Bearer ${token}" \
            "https://api.supabase.com/v1/projects/${ref}")
          case "$probe" in
            401|403)
              echo "::error::Supabase lehnt den Zugriff ab (HTTP $probe) – der SUPABASE_ACCESS_TOKEN ist ungültig, abgelaufen oder widerrufen. Die Migrationen selbst wurden gar nicht erst ausgeführt."
              echo "::error::So beheben: 1) Neuen Token erzeugen unter https://supabase.com/dashboard/account/tokens  2) In GitHub unter Settings → Secrets and variables → Actions das Secret SUPABASE_ACCESS_TOKEN ersetzen  3) Diesen Workflow im Actions-Tab über 'Run workflow' erneut starten."
              exit 1 ;;
            404)
              echo "::error::Projekt '$ref' nicht gefunden oder für diesen Token nicht freigegeben (HTTP 404). Reference ID im Supabase-Dashboard unter Settings → General prüfen. Pausierte Projekte (Free-Tier) müssen dort zuerst reaktiviert werden."
              exit 1 ;;
            2*)
              echo "✓ Zugang geprüft – Projekt erreichbar." ;;
            *)
              echo "::error::Supabase-API antwortet unerwartet (HTTP $probe): $(cat probe.json)"
              exit 1 ;;
          esac

          api="https://api.supabase.com/v1/projects/${ref}/database/query"
          fail=0
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "── Wende an: $f"
            jq -Rs '{query: .}' "$f" > payload.json
            code=$(curl -sS -o resp.json -w "%{http_code}" \
              -X POST "$api" \
              -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" \
              --data-binary @payload.json)
            echo "   HTTP $code"
            echo "   Antwort: $(cat resp.json)"
            # Auth-Fehler werden mit der nächsten Datei nicht besser → Abbruch.
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "::error::Zugriff verweigert (HTTP $code) – Abbruch. Bitte SUPABASE_ACCESS_TOKEN erneuern (siehe Hinweis oben)."
              exit 1
            fi
            if [ "$code" -ge 300 ]; then
              echo "::error::$f fehlgeschlagen (HTTP $code)"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "::error::Mindestens eine Migration ist fehlgeschlagen."
            exit 1
          fi
          echo "✓ Alle Migrationen erfolgreich angewendet."
