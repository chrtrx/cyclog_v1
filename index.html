<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070d1a" />
  <meta name="description" content="Cyclog – Verschleiß-Tracker für dein Fahrrad mit Strava-Sync" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cyclog" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <title>Cyclog</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';</script>
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -webkit-touch-callout: none;
    }
    html {
      overflow-x: hidden;
      overscroll-behavior: none;
      overscroll-behavior-x: none;
      height: 100%;
    }
    :root {
      /* ── NEUE Datenblatt-Palette (dunkelblau) ── */
      --bg0:#070d1a; --bg2:#0a1426; --panel:#0c1730; --panel2:#0e1b38;
      --line:#1c2c4d; --line2:#16243f;
      --acc:#2f7bff; --acc-d:#1f5fd0; --acc-soft:#3a6fc4;
      --on-acc:#fff;          /* Schrift auf Akzentflächen */
      --brand:#2f7bff;        /* Markenfarbe: Schriftzug oben */
      --ink1:#eef3fb; --ink2:#8fa3c8; --ink3:#54678c;
      --ok:#34c79a; --warn:#e0a84d; --crit:#e0566e;
      --mono:'JetBrains Mono', ui-monospace, monospace;
      --sans:'Inter', -apple-system, sans-serif;

      /* ── BRÜCKE: alte Variablennamen → neue Werte ──
         damit noch nicht umgebaute Seiten weiter funktionieren */
      --green:#34c79a; --green-d:#2aa382; --green-l:rgba(52,199,154,.12);
      --blue:#2f7bff; --blue-d:#1f5fd0; --blue-l:rgba(47,123,255,.12);
      --orange:#e0a84d; --orange-d:#c08f3a; --orange-l:rgba(224,168,77,.12);
      --red:#e0566e; --red-d:#c4495e; --red-l:rgba(224,86,110,.12);
      --strava:#fc4c02; --strava-d:#d94002; --strava-l:rgba(252,76,2,.12);
      --bg:#070d1a; --white:#0c1730;
      --t1:#eef3fb; --t2:#8fa3c8; --t3:#54678c; --border:#1c2c4d;
      --r-xl:6px; --r-lg:6px; --r-md:4px; --r-sm:4px;
    }
    /* ── Schwarz-Weiß mit rotem Schriftzug ──
       Farbe erscheint nur noch an zwei Stellen: oben die Marke, in den
       Balken der Zustand. Alles dazwischen bleibt ruhig. */
    [data-theme="mono"] {
      --bg0:#08080a; --bg2:#0f0f11; --panel:#131316; --panel2:#191920;
      --line:#2a2a33; --line2:#212128;
      --acc:#f2f2f5; --acc-d:#d2d2d8; --acc-soft:#83838f;
      --on-acc:#0b0b0e;       /* heller Akzent braucht dunkle Schrift */
      --brand:#ff2b2b;
      --ink1:#f4f4f7; --ink2:#9b9ba6; --ink3:#5f5f6b;
      --ok:#2fbf87; --warn:#e8a83a; --crit:#ff2b2b;
      --mono:'JetBrains Mono', ui-monospace, monospace;
      --sans:'Inter', -apple-system, sans-serif;
      --green:#2fbf87; --green-d:#26a173; --green-l:color-mix(in srgb, #2fbf87 12%, transparent);
      --blue:#f2f2f5; --blue-d:#d2d2d8; --blue-l:color-mix(in srgb, #f2f2f5 12%, transparent);
      --orange:#e8a83a; --orange-d:#c68f2f; --orange-l:color-mix(in srgb, #e8a83a 12%, transparent);
      --red:#ff2b2b; --red-d:#d92222; --red-l:color-mix(in srgb, #ff2b2b 12%, transparent);
      --strava:#f2f2f5; --strava-d:#d2d2d8; --strava-l:color-mix(in srgb, #f2f2f5 12%, transparent);
      --bg:#08080a; --white:#131316;
      --t1:#f4f4f7; --t2:#9b9ba6; --t3:#5f5f6b; --border:#2a2a33;
      --r-xl:6px; --r-lg:6px; --r-md:4px; --r-sm:4px;
    }
    /* Emoji-Symbole entsättigen, damit sie zum einfarbigen Bild passen */
    [data-theme="mono"] .tc-ico,
    [data-theme="mono"] .bchip,
    [data-theme="mono"] .sec-icon,
    [data-theme="mono"] .mr-icon,
    [data-theme="mono"] .streak,
    [data-theme="mono"] .bell-btn,
    [data-theme="mono"] .id-type-btn { filter: grayscale(1); }
    [data-theme="light"] {
      --bg0:#f0f5ff; --bg2:#ffffff; --panel:#ffffff; --panel2:#f0f4fc;
      --line:#ccd5ec; --line2:#d8dfef;
      --acc:#2f7bff; --acc-d:#1f5fd0; --acc-soft:#5590f5;
      --on-acc:#fff; --brand:#2f7bff;
      --ink1:#0a1628; --ink2:#3a5080; --ink3:#8098c4;
      --ok:#1aab7f; --warn:#b8720e; --crit:#c4364f;
      --mono:'JetBrains Mono',ui-monospace,monospace;
      --sans:'Inter',-apple-system,sans-serif;
      --bg:#f0f5ff; --white:#ffffff;
      --t1:#0a1628; --t2:#3a5080; --t3:#8098c4; --border:#ccd5ec;
    }
    html, body { background: var(--bg0); overflow-x: hidden; }
    body {
      font-family: var(--sans);
      color: var(--ink1);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overscroll-behavior: none;
      overscroll-behavior-x: none;
    }
    /* Hintergrund-Verlauf als fixer Layer hinter dem Inhalt – kein teures
       Neuzeichnen beim Scrollen (ersetzt background-attachment: fixed). */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(120% 90% at 85% -10%, rgba(47,123,255,.16), transparent 55%),
        radial-gradient(110% 80% at 5% 8%, rgba(34,211,238,.10), transparent 50%),
        linear-gradient(180deg, #0c1730, #070d1a);
    }
    [data-theme="light"] body::before {
      background:
        radial-gradient(120% 90% at 85% -10%, rgba(47,123,255,.07), transparent 55%),
        radial-gradient(110% 80% at 5% 8%, rgba(34,211,238,.04), transparent 50%),
        linear-gradient(180deg, #f8fbff, #edf2fc);
    }
    /* Eine gemeinsame Inhaltsbreite für Seite UND Navigationsleiste – sonst
       laufen die beiden auf breiten Schirmen auseinander. */
    :root { --app-w: 480px; }
    @media (min-width: 700px)  { :root { --app-w: 560px; } }
    /* Ab Tablet-Breite die volle Flaeche nutzen: eine zentrierte Spalte
       laesst links und rechts breite leere Baender stehen. */
    @media (min-width: 900px)  { :root { --app-w: 100%; } }
    /* Auf Tablet/Desktop wirkt die Oberfläche sonst wie eine vergrößerte
       Handy-Ansicht: Schrift und Bedienelemente sind zu klein für den
       Betrachtungsabstand. Sämtliche Größen sind fest in px angegeben –
       ein gleichmäßiger Zoom hält deshalb alle Proportionen exakt, statt
       zweihundert Einzelwerte nachzuziehen. */
    @media (min-width: 820px)  { :root { zoom: 1.15; } }
    @media (min-width: 1150px) { :root { zoom: 1.25; } }
    #root {
      max-width: var(--app-w);
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      overflow-x: hidden;
    }
    /* Querformat auf dem Tablet: niedriger, aber sehr breiter Schirm. Die
       senkrechten Abstände werden gestaucht, damit oben nicht die halbe
       Höhe für Kopfzeilen draufgeht. */
    @media (orientation: landscape) and (max-height: 900px) and (min-width: 900px) {
      .page-hdr, .hdr { padding-top: 10px !important; padding-bottom: 10px !important; }
      .page-body, .main { padding-top: 12px !important; }
    }
    button { font-family: inherit; cursor: pointer; user-select: none; -webkit-user-select: none; }
    input, textarea { font-family: inherit; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 0; }
    .nunito { font-family: var(--sans); }
    .mono { font-family: var(--mono); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
